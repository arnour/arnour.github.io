subtitle: "Mark Richards & Neal Ford — Quiz de Avaliação Interativo"
standard:
  - q: "De acordo com o Capítulo 2, quais são os quatro principais aspetos que compõem o 'Pensamento Arquitetural' (Architectural Thinking)?"
    options:
      - "Escrever código em TDD, criar diagramas UML, gerir orçamentos e negociar salários."
      - "Compreender arquitetura vs. design, ter amplitude técnica, analisar trade-offs e compreender direcionadores de negócio."
      - "Dominar uma única tecnologia, evitar testes unitários, focar em cascatas e delegar reuniões."
      - "Conhecer a história do hardware, escrever documentação estática, gerir servidores físicos e desenhar bases relacionais."
    answer: 1
    explanation: "O capítulo define o pensamento arquitetural através de quatro vertentes: entender a diferença entre arquitetura e design, manter amplitude técnica, analisar trade-offs e conectar direcionadores de negócio."
  - q: 'Qual é a principal falha apontada no modelo tradicional de separação entre arquitetos e programadores (ilustrado na Figura 2-1)?'
    options:
      - 'Os arquitetos recebem salários demasiado altos comparados com os programadores.'
      - "A seta unidirecional e as barreiras físicas/virtuais que impedem o feedback bidirecional, fazendo com que a arquitetura raramente cumpra o seu propósito."
      - 'Os programadores recusam-se a utilizar linguagens orientadas a objetos.'
      - 'A falta de computadores portáteis para a equipa de arquitetura.'
    answer: 1
    explanation: 'O modelo tradicional falha porque a separação unidirecional impede que as decisões do arquiteto cheguem aos programadores e que as realidades do código voltem ao conhecimento do arquiteto.'
  - q: 'Como os autores descrevem a relação entre arquitetura e design no Capítulo 2?'
    options:
      - 'São disciplinas opostas e estanques que nunca se devem cruzar.'
      - 'O design é opcional e a arquitetura substitui completamente o código-fonte.'
      - 'Eles não têm um fim definido um para o outro; fazem parte do ciclo de vida e devem manter-se em constante sincronização através da colaboração.'
      - 'O design ocorre apenas após o sistema entrar em obsolescência.'
    answer: 2
    explanation: 'Arquitetura e design não têm um ponto final isolado; ambos integram o ciclo de vida do software e exigem sincronização contínua através de equipas colaborativas.'
  - q: "No contexto da pirâmide de conhecimento, qual é a principal diferença de foco entre um programador e um arquiteto de software?"
    options:
      - "O programador foca-se na profundidade (technical depth) para manter a especialização, enquanto o arquiteto foca-se na amplitude (technical breadth) para conhecer uma vasta gama de soluções."
      - 'O arquiteto evita completamente conhecer novas tecnologias.'
      - 'O programador deve ignorar a linguagem de programação e focar-se em gestão de marketing.'
      - 'Não existe diferença na distribuição do conhecimento entre ambos.'
    answer: 0
    explanation: "Enquanto o início de carreira do programador exige expandir o topo da pirâmide (profundidade), o arquiteto precisa sacrificar parte da especialização para expandir a secção média (amplitude técnica)."
  - q: "O que caracteriza o antipadrão comportamental denominado 'Frozen Caveman Anti-Pattern'?"
    options:
      - 'Um arquiteto que congela o código em servidores físicos antigos para poupar eletricidade.'
      - "Um arquiteto que sempre recorre a uma preocupação irracional ou trauma passado (ex: 'mas e se perdermos a Itália?') para todas as arquiteturas novas."
      - 'Um programador que se recusa a atualizar o seu sistema operativo há mais de 10 anos.'
      - 'Uma equipa que armazena dados em gelo sintético.'
    answer: 1
    explanation: "O 'Frozen Caveman' descreve um arquiteto marcado por uma falha ou incidente antigo que passa a manifestar uma cautela obsessiva e desproporcionada em projetos futuros."
  - q: "Segundo a famosa citação de Mark Richards no Capítulo 2, como se define a arquitetura em contraste com o que pode ser encontrado na internet?"
    options:
      - "'Arquitetura é o que está escrito nos manuais da Oracle.'"
      - "'Arquitetura são as coisas que você não consegue pesquisar no Google (it depends).'"
      - "'Arquitetura é a quantidade de linhas de código por segundo.'"
      - "'Arquitetura é o custo total de infraestrutura em nuvem.'"
    answer: 1
    explanation: "A citação emblemática destaca que 'Architecture is the stuff you can't Google', pois as respostas dependem sempre do contexto, ambiente e restrições."
  - q: "No exemplo do sistema de leilões (Auction System) comparando filas (queues) e tópicos (topics), qual é a principal vantagem de utilizar um tópico (pub-sub)?"
    options:
      - 'Maior segurança contra acessos não autorizados e eavesdropping.'
      - "Extensibilidade arquitetural superior, permitindo que novos consumidores (como histórico de licitações) se inscrevam sem modificar o produtor."
      - 'Eliminação total da latência de rede.'
      - 'Garantia de contratos heterogéneos automáticos.'
    answer: 1
    explanation: "O uso de tópicos oferece extensibilidade arquitetural: adicionar um novo serviço ou ouvinte não exige alterações no serviço produtor (ao contrário de criar filas dedicadas)."
  - q: 'Quais são as desvantagens apontadas ao utilizar tópicos em vez de filas no exemplo do leilão?'
    options:
      - "Dificuldade de escala automática e ausência de monitorização de mensagens por tópico, ausência de contratos heterogéneos e maiores riscos de segurança (eavesdropping)."
      - 'Menor desempenho de rede e aumento obrigatório da complexidade do hardware.'
      - 'Incompatibilidade total com linguagens baseadas em objetos.'
      - 'Impossibilidade de utilizar protocolos assíncronos.'
    answer: 0
    explanation: "Os tópicos facilitam o acesso de escuta (risco de segurança), exigem contratos homogéneos para todos os subscritores e dificultam a contagem de mensagens individuais para auto-scaling por consumidor."
  - q: "O que é a 'Bottleneck Trap' (Armadilha do Gargalo) quando um arquiteto tenta manter as mãos na massa?"
    options:
      - 'Quando o arquiteto passa demasiado tempo em reuniões de planeamento.'
      - 'Quando o arquiteto assume a posse de código no caminho crítico do projeto (como frameworks core) e torna-se um obstáculo devido à sua divisão de atenções.'
      - 'Quando o arquiteto bloqueia o tráfego de rede entre microsserviços.'
      - 'Quando o arquiteto recusa aprovar novos servidores de base de dados.'
    answer: 1
    explanation: "A bottleneck trap ocorre quando o arquiteto assume código essencial no caminho crítico sem ter tempo integral de programador, atrasando a equipa."
  - q: "Qual das seguintes estratégias é recomendada no Capítulo 2 para que um arquiteto se mantenha prático ('hands-on') sem prejudicar o projeto?"
    options:
      - 'Escrever código estrito para todas as funcionalidades críticas de negócio do trimestre.'
      - "Fazer POCs de qualidade de produção, resolver tarefas de dívida técnica de menor prioridade, corrigir bugs ou criar ferramentas de automação e validação para a equipa."
      - 'Trabalhar em regime de turnos noturnos no suporte de infraestrutura.'
      - 'Escrever apenas documentação técnica em formato PDF.'
    answer: 1
    explanation: "Os autores sugerem POCs de alta qualidade, histórias de dívida técnica não urgentes, correções de bugs, ferramentas utilitárias de automação e code reviews."
  - q: "Segundo a citação de Rich Hickey mencionada no Capítulo 2, qual é a diferença de perspetiva entre programadores e arquitetos?"
    options:
      - "'Programadores conhecem a sintaxe e arquitetos conhecem os gestores.'"
      - "'Programadores conhecem os benefícios de tudo e os trade-offs de nada; arquitetos precisam de entender ambos.'"
      - "'Programadores criam bugs e arquitetos corrigem-nos.'"
      - "'Programadores focam em hardware e arquitetos em software.'"
    answer: 1
    explanation: "Rich Hickey observa que os programadores tendem a ver apenas os benefícios das tecnologias, enquanto os arquitetos precisam de compreender rigorosamente os trade-offs."
  - q: "Como a análise dos direcionadores de negócio (Business Drivers) impacta o trabalho do arquiteto, segundo o Capítulo 2?"
    options:
      - 'Ajuda a traduzir metas corporativas e de mercado em características arquiteturais concretas (-ilities).'
      - 'Permite eliminar completamente a necessidade de escrever testes de software.'
      - 'Garante que o orçamento da empresa seja aplicado exclusivamente em licenças de software comercial.'
      - 'Substitui a necessidade de manter contactos com os administradores de rede.'
    answer: 0
    explanation: 'Compreender os direcionadores de negócio permite ao arquiteto extrair e priorizar corretamente as características arquiteturais exigidas pelo sistema.'
bonus:
  - q: "[BÔNUS IA 1] No Capítulo 2, discute-se a importância da amplitude técnica (technical breadth) em vez da especialização restrita. Na era dos assistentes de IA generativa capazes de gerar código em dezenas de linguagens, como o conceito de amplitude técnica se aplica ao arquiteto?"
    options:
      - "O arquiteto passa a dispensar conhecimentos tecnológicos, pois a IA decide a pilha tecnológica."
      - "A amplitude técnica torna-se ainda mais crítica para avaliar criticamente a validade arquitetural, a segurança e os padrões das soluções sugeridas por modelos de IA em múltiplos domínios."
      - 'A amplitude técnica deixa de existir em favor da profundidade absoluta em uma única IA.'
      - 'O arquiteto deve focar exclusivamente em treinar modelos de linguagem locais.'
    answer: 1
    explanation: "Com a IA a democratizar a sintaxe, a amplitude técnica do arquiteto serve como critério essencial de curadoria e governação para validar se o código gerado cumpre os padrões estruturais adequados."
  - q: "[BÔNUS IA 2] O Capítulo 2 enfatiza que 'não existem respostas certas ou erradas na arquitetura — apenas trade-offs'. Ao ponderar a adoção de arquiteturas baseadas em RAG (Retrieval-Augmented Generation) versus Fine-Tuning de LLMs, qual análise de trade-off reflete o pensamento arquitetural?"
    options:
      - "Fine-tuning garante precisão em tempo real de dados dinâmicos a custo zero, sem trade-offs."
      - "RAG oferece facilidade de atualização de dados e menor custo, mas introduz trade-offs em termos de latência de busca vetorial, tamanho de contexto e dependência de fontes externas; Fine-tuning personaliza o comportamento interno, mas é estático e dispendioso."
      - 'Ambas as abordagens eliminam completamente a necessidade de persistência de dados.'
      - 'Não há custos operacionais ou limitações de latência em nenhuma das opções de IA.'
    answer: 1
    explanation: "O pensamento arquitetural avalia os trade-offs inerentes: RAG foca-se em conhecimento externo atualizável (com custo de latência de recuperação), enquanto Fine-tuning internaliza conhecimento (com alto custo de treino e estaticidade)."
  - q: "[BÔNUS IA 3] Um dos alertas do Capítulo 2 é o 'Frozen Caveman Anti-Pattern', onde o arquiteto fica marcado por um trauma tecnológico passado e resiste a inovações. Na era atual, como esse antipadrão pode manifestar-se face ao avanço da Inteligência Artificial?"
    options:
      - "Rejeitar preventivamente qualquer utilidade da IA em arquitetura de software devido a falhas pontuais iniciais de modelos, ou, inversamente, adotar cegamente agentes de IA em tudo sem análise de risco."
      - 'Atualizar os servidores semanalmente sem testes de carga.'
      - 'Utilizar apenas folhas de cálculo para desenhar microsserviços.'
      - 'Consultar exclusivamente manuais impressos de 1985.'
    answer: 0
    explanation: 'O antipadrão manifesta-se tanto no ceticismo extremo e paralisante quanto na adoção dogmática e acrítica de novas tecnologias sem avaliação sob a ótica de trade-offs.'
  - q: "[BÔNUS IA 4] Para manter as mãos na massa ('hands-on') sem cair na 'bottleneck trap', o Capítulo 2 sugere criar POCs, automações e revisões de código. Como os arquitetos podem utilizar ferramentas de IA para cumprir essa diretriz de forma eficaz nos dias de hoje?"
    options:
      - 'Deixando que a IA construa toda a arquitetura de produção em segredo sem validação da equipa.'
      - "Utilizando assistentes de IA para prototipar rapidamente POCs de avaliação de novas ferramentas de cache ou mensuração, focando o tempo na análise de trade-offs e na mentoria da equipa."
      - 'Eliminando as reuniões de alinhamento com os programadores.'
      - 'Usando IA apenas para gerar relatórios financeiros anuais.'
    answer: 1
    explanation: "A IA acelera a prototipagem de POCs, permitindo ao arquiteto testar empiricamente opções técnicas e focar o seu esforço humano na análise de trade-offs, governação e suporte à equipa."
